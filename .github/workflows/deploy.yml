name: Build and Content Automation

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-health-content:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Report missing importer configuration
        if: ${{ secrets.CONTENT_IMPORT_SECRET == '' }}
        run: echo "::warning::CONTENT_IMPORT_SECRET is not configured; draft import was skipped."

      - name: Import relevant health content as drafts
        if: ${{ secrets.CONTENT_IMPORT_SECRET != '' }}
        env:
          CONTENT_API_URL: ${{ vars.CONTENT_API_URL || 'https://tha-webacdb.vercel.app' }}
          CONTENT_IMPORT_SECRET: ${{ secrets.CONTENT_IMPORT_SECRET }}
          HEALTH_SOURCE_FEEDS: ${{ secrets.HEALTH_SOURCE_FEEDS }}
        run: node scripts/importHealthContent.js

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 3
